[project]
name = "ai-test-runner-backend"
version = "0.1.0"
description = "Backend (REST API + worker) của AI Test Runner"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.5",
    "fastapi>=0.162.5",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.oauth2.*", "authlib.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
